# docker-compose.deploy.yml
# Used for pulling and running pre-built images from Docker Hub
# Tailscale sidecar pattern for HTTPS via Tailscale Serve
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: airbrush-web
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME}/airbrush-web-frontend:latest
    network_mode: service:tailscale
    depends_on:
      - tailscale
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME}/airbrush-web-backend:latest
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - frontend
    restart: unless-stopped
    volumes:
      - airbrush-web-data:/data

volumes:
  airbrush-web-data:
  tailscale-state:
