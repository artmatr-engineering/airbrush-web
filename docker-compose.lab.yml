# docker-compose.lab.yml
# Used for LAB environment deployment
# Tailscale sidecar pattern for HTTPS via Tailscale Serve
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: airbrush-web-tailscale-lab
    hostname: airbrush-web-lab
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state-lab:/var/lib/tailscale
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME}/airbrush-web-frontend:latest
    container_name: airbrush-web-frontend-lab
    network_mode: service:tailscale
    depends_on:
      - tailscale
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME}/airbrush-web-backend:latest
    container_name: airbrush-web-backend-lab
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - frontend
    environment:
      - SENTRY_DSN=${MATR_LAB_SENTRY_DSN}
    restart: unless-stopped
    volumes:
      - airbrush-web-data-lab:/data

volumes:
  airbrush-web-data-lab:
  tailscale-state-lab:
