name: deploy-airbrush-web-dev
on:
  push:
    branches: [dev]

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/airbrush-web-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/airbrush-web-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Show image info
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "Successfully built and pushed:"
          echo "- ${DOCKERHUB_USERNAME}/airbrush-web-backend:latest"
          echo "- ${DOCKERHUB_USERNAME}/airbrush-web-frontend:latest"

  deploy:
    name: Pull & Deploy
    needs: build-and-push
    runs-on: ["self-hosted", "matr-vps"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Stop and remove existing containers
        run: |
          # Stop and remove containers if they exist (preserve volumes)
          docker compose -p airbrush-web-dev -f docker-compose.dev.yml down --remove-orphans || true

          # Remove any dangling images to free up space
          docker image prune -f || true

      - name: Pull and start containers
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          MATR_DEV_SENTRY_DSN: ${{ secrets.MATR_DEV_SENTRY_DSN }}
        run: |
          # Pull latest images
          docker compose -p airbrush-web-dev -f docker-compose.dev.yml pull

          # Start the application with pulled images
          docker compose -p airbrush-web-dev -f docker-compose.dev.yml up -d

      - name: Verify deployment
        run: |
          # Wait a moment for services to start
          sleep 10

          # Check if containers are running
          docker compose -p airbrush-web-dev -f docker-compose.dev.yml ps

      - name: Clean up old images
        run: |
          # Remove unused images to save space
          docker image prune -f

      - name: Show container logs (on failure)
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker compose -p airbrush-web-dev -f docker-compose.dev.yml ps
          echo "=== Backend Logs ==="
          docker compose -p airbrush-web-dev -f docker-compose.dev.yml logs backend
          echo "=== Frontend Logs ==="
          docker compose -p airbrush-web-dev -f docker-compose.dev.yml logs frontend
