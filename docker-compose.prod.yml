services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    restart: unless-stopped
    volumes:
      - airbrush-web-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  airbrush-web-data:
