services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    restart: unless-stopped
    volumes:
      - airbrush-web-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The public domain Caddy serves and auto-provisions a Let's Encrypt
      # cert for (e.g. something.duckdns.org). Set in the server's .env.
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  airbrush-web-data:
  caddy-data:
  caddy-config:
